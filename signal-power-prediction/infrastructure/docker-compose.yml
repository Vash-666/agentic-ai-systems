# Level-Game Infrastructure Services
# Signal Power Prediction System
# Docker Compose Configuration

version: '3.8'

services:
  # ============================================
  # DATABASE
  # ============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: spp-postgres
    environment:
      POSTGRES_DB: signal_power
      POSTGRES_USER: spp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spp_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sprint-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spp_user -d signal_power"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # REDIS (Caching & Events)
  # ============================================
  
  redis:
    image: redis:7-alpine
    container_name: spp-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # API SERVER
  # ============================================
  
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: spp-api
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: signal_power
      DB_USER: spp_user
      DB_PASS: ${DB_PASSWORD:-spp_secret_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-spp_jwt_secret_change_in_production}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./sprints:/app/sprints:ro
      - ./events:/app/events
      - ./notifications:/app/notifications
      - ./xp-awards:/app/xp-awards
    networks:
      - spp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # WEB DASHBOARD
  # ============================================
  
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: spp-dashboard
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # AGENT COORDINATOR SERVICE
  # ============================================
  
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: spp-coordinator
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: signal_power
      DB_USER: spp_user
      DB_PASS: ${DB_PASSWORD:-spp_secret_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./sprints:/app/sprints
      - ./events:/app/events
      - ./notifications:/app/notifications
      - ./xp-awards:/app/xp-awards
      - ./infrastructure/agent-coordinator.yaml:/app/config/coordinator.yaml:ro
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # NOTIFICATION SERVICE
  # ============================================
  
  notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    container_name: spp-notifier
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./notifications:/app/notifications
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # MONITORING - PROMETHEUS
  # ============================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: spp-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # MONITORING - GRAFANA
  # ============================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: spp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # LOG AGGREGATION - LOKI
  # ============================================
  
  loki:
    image: grafana/loki:latest
    container_name: spp-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - spp-network
    restart: unless-stopped

  # ============================================
  # CI/CD RUNNER (Self-hosted)
  # ============================================
  
  github-runner:
    image: myoung34/github-runner:latest
    container_name: spp-runner
    environment:
      REPO_URL: ${GITHUB_REPO_URL:-}
      RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN:-}
      RUNNER_NAME: spp-level-game-runner
      LABELS: self-hosted,level-game
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/home/github-runner
      - ./sprints:/home/github-runner/sprints
    networks:
      - spp-network
    restart: unless-stopped
    profiles:
      - cicd

# ============================================
# VOLUMES
# ============================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  runner_data:
    driver: local

# ============================================
# NETWORKS
# ============================================

networks:
  spp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
